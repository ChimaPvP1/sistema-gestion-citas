{% extends "base.html" %}
{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Sistema de Gestión de Citas y Atención</p>

    {% if form.errors %}
        <p class="mensaje-exito" style="background:#fdecea; color:#b42318;">
            Correo/usuario o contraseña incorrectos.
        </p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label for="id_username">Correo o usuario</label>
        <input type="text" name="username" id="id_username" required autofocus>

        <label for="id_password">Contraseña</label>
        <input type="password" name="password" id="id_password" required>

        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit">Iniciar sesión</button>
    </form>

    <p class="enlace-secundario">
        ¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>
    </p>
{% endblock %}
