<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Sistema de Citas{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f2f5f9;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .tarjeta {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 32px 28px;
            border-radius: 10px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.08);
        }
        .tarjeta h1 {
            font-size: 22px;
            color: #2f3b52;
            margin-bottom: 6px;
            text-align: center;
        }
        .subtitulo {
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 22px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #374151;
            margin-bottom: 4px;
            margin-top: 14px;
        }
        input[type=text], input[type=email], input[type=password] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus { outline: none; border-color: #2f6f8f; }
        button, .boton {
            width: 100%;
            padding: 11px;
            margin-top: 22px;
            background: #2f6f8f;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        button:hover, .boton:hover { background: #26576f; }
        .enlace-secundario {
            text-align: center;
            margin-top: 16px;
            font-size: 13.5px;
            color: #6b7280;
        }
        .enlace-secundario a { color: #2f6f8f; text-decoration: none; font-weight: 600; }
        .errorlist { color: #b42318; font-size: 12.5px; list-style: none; padding: 0; margin: 4px 0 0; }
        .mensaje-exito {
            background: #e6f4ea; color: #1e7a34; padding: 10px 12px;
            border-radius: 6px; font-size: 13.5px; margin-bottom: 14px; text-align: center;
        }
    </style>
</head>
<body>
    <div class="tarjeta">
        {% block contenido %}{% endblock %}
    </div>
</body>
</html>
